name: CI

on:
    push:
        branches:
            - main
            - develop
    pull_request:
        branches:
            - main
            - develop

# Cancel in-progress runs for the same workflow and PR/branch
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

# Minimal permissions for security
permissions:
    contents: read

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # Full history for Turbo cache

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.4.1

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run lint
              run: pnpm lint

    format-check:
        name: Format Check
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.4.1

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Check formatting
              run: pnpm format:check

    typecheck:
        name: Type Check
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.4.1

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run typecheck
              run: pnpm typecheck

    # Placeholder for when tests are added
    # test:
    #     name: Test
    #     runs-on: ubuntu-latest
    #     timeout-minutes: 15
    #     steps:
    #         - name: Checkout code
    #           uses: actions/checkout@v4
    #           with:
    #               fetch-depth: 0
    #
    #         - name: Setup pnpm
    #           uses: pnpm/action-setup@v4
    #           with:
    #               version: 10.4.1
    #
    #         - name: Setup Node.js
    #           uses: actions/setup-node@v4
    #           with:
    #               node-version: '20'
    #               cache: 'pnpm'
    #
    #         - name: Install dependencies
    #           run: pnpm install --frozen-lockfile
    #
    #         - name: Run tests
    #           run: pnpm test

    build:
        name: Build
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: [lint, format-check, typecheck]
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.4.1

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run build
              run: pnpm build
              env:
                  # Build-time environment variables
                  NODE_ENV: production

                  # Database (required for build-time queries)
                  POSTGRES_URL: ${{ secrets.POSTGRES_URL || 'postgresql://localhost:5432/test' }}

                  # Auth (required for middleware/API route builds)
                  AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'test-secret-min-32-chars-long-ci-build' }}

                  # Public variables (safe to set, used in build)
                  NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://example.com' }}
                  NEXT_PUBLIC_SITE_NAME: 'Alluring Plastic Surgery'
                  NEXT_PUBLIC_WEB_URL: ${{ secrets.NEXT_PUBLIC_WEB_URL || 'https://example.com' }}
                  NEXT_PUBLIC_ENABLE_INDEXING: 'false'
                  NEXT_PUBLIC_ALLOW_CRAWLING: 'false'
                  NEXT_PUBLIC_BETA_MODE: 'false'
                  NEXT_PUBLIC_CHAT_ENABLED: 'false'
                  NEXT_PUBLIC_ENABLE_MOBILE_CALL_BUTTON: 'false'

                  # Optional API keys (build continues without them)
